name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iReader (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (NSIS + MSI)
        run: npm run tauri build -- --bundles nsis,msi

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-out | Out-Null
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue
          $msi  = Get-ChildItem -Path src-tauri/target/release/bundle/msi  -Filter *.msi -ErrorAction SilentlyContinue
          $exe  = "src-tauri/target/release/ireader-windows.exe"
          if (Test-Path $exe) {
            Compress-Archive -Path $exe -DestinationPath dist-out/iReader-windows-portable.zip -Force
          }
          if ($nsis) { Copy-Item $nsis[0].FullName dist-out/iReader-windows-setup.exe }
          if ($msi)  { Copy-Item $msi[0].FullName  dist-out/iReader-windows.msi }
          Get-ChildItem dist-out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: iReader-windows
          path: windows/dist-out/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "iReader $TAG" --generate-notes
          fi
          gh release upload "$TAG" windows/dist-out/* --clobber
